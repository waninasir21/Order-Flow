# Render Blueprint: New > Blueprint > pick this repo. Secrets are NOT in this file; the dashboard
# asks for the ones marked `sync: false`, and JWT_SECRET is generated by Render.
services:
  - type: web
    name: orderflow-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free # sleeps after ~15 min idle (cold start ~30-60 s); use "starter" for a demo that must not sleep
    region: singapore # closest Render region to Bangalore; keep the database in the same region
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon connection string (use the direct, non-pooled one: migrations take advisory locks)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS # optional; the web dashboard calls the API server-to-server, so it needs no CORS entry
        sync: false
